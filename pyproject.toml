[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thirteenf"
version = "0.4.0"
description = "CLI for 13f.info 13F data and SEC EDGAR submissions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cyclopts>=3.0",
    "httpx>=0.27",
    "rich>=13.0",
    "yfinance>=0.2",
]

[project.scripts]
13f = "thirteenf.cli:main"

[tool.setuptools.packages.find]
include = ["thirteenf*"]
